name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: ./game
        run: npm ci

      # 게이트 1 — ESLint (--max-warnings 0: error/warning 모두 실패 처리)
      - name: Lint
        working-directory: ./game
        run: npm run lint

      # 게이트 1b — 유닛/컴포넌트 테스트. **여기 오기 전까지 CI에서 한 번도 안 돌았다**
      # (871개가 전부 로컬 전용이었다). 그 상태에서 "테스트로 잠갔다"는 말은 사실이 아니다.
      # 실측: 폰트 조각 선택의 범위 비교를 `cp <= end`에서 `cp < end`로 바꾸면 첫 화면
      # preload가 9조각 229KB에서 3조각 83KB로 줄어드는데, vitest는 잡고 CI는 전 게이트를
      # 통과했다. 전체 스위트가 9초다 — 잠금을 새로 만들 때 여기서 도는지부터 확인할 것.
      - name: Test
        working-directory: ./game
        run: npm test

      # 게이트 1c — **그 테스트가 실제로 전부 돌았는가.** 위 스텝은 `npm test`가 있는지만 본다.
      # 실측: vite.config.ts의 `include`를 한 줄 좁히면 93파일 1059개가 50파일 613개로 주는데
      # 전 게이트가 초록이었다. `"test": "true"`도 마찬가지다. 스텝의 존재도 스크립트 본문의
      # 문자열도 이걸 못 잡는다 — 실행된 파일 목록을 디스크와 대조해야 한다.
      # 이 스텝이 사라지는 것은 content-verify job의 verify:ci-gates가 잡는다.
      - name: Verify test coverage floor
        working-directory: ./game
        run: npm run verify:test-floor

      # 게이트 2 — 타입체크 + 번들 빌드 + 이미지 webp 트랜스코딩 (GEN_WEBP=1)
      # build:release 를 쓰는 이유: 런타임(webpSrc)은 .webp만 요청하는데 일반 build는 png를
      # 그대로 남겨 배포되어, 실서버가 생 png 1.0GB를 서비스하고 .webp는 404가 됐다.
      # release 경로는 webp 생성 후 원본 png를 지워 배포 산출물을 1.0GB→64MB로 떨어뜨린다.
      # PR에서도 같은 경로를 돌려야 webp 누락(=실서버 404)을 머지 전에 잡을 수 있다.
      - name: Typecheck & Build (release — webp)
        working-directory: ./game
        run: npm run build:release

      # 게이트 2b — 배포 산출물의 폰트 정합성. **여기서만 확인 가능한 것들이다:**
      # base('/LIFE_TRACK/')가 붙은 폰트 경로(어긋나면 실서버에서 폰트 전부 404인데, 증상이
      # "그냥 시스템 폰트로 보임"이라 눈으로 구분되지 않는다) · 미니파이 후 unicode-range 잔존 ·
      # OFL 고지 동봉. content-verify job은 별도 러너라 dist를 볼 수 없어서 이 job에 둔다.
      - name: Verify dist fonts
        working-directory: ./game
        run: npm run verify:dist-fonts

      # 게이트 2c — 배포 산출물 위생(개발용 html·*-review 등). **여기서만 확인 가능하다:**
      # 실제로 공개되는 것은 dist이고, 소스 층(public/에 개발용 html이 없다)만 보면
      # 다른 경로로 dist에 다시 들어오는 것을 못 잡는다. content-verify job은 별도 러너라
      # dist를 볼 수 없어서 이 job에 둔다 (verify:dist-fonts 와 같은 이유).
      # verify:ci에 넣으면 dist가 아예 없어 섹션 1에서 곧바로 실패한다(통과 경로는 없다).
      # 문제는 조용한 통과가 아니라 그 실패가 배포 산출물에 대해 아무것도 말해주지 않는
      # 상시 빨강이라는 점이다 — 정작 실서버에 나가는 파일은 한 번도 안 본다.
      - name: Verify dist hygiene
        working-directory: ./game
        run: npm run verify:dist-hygiene

      # 게이트 2d — 청크 분할. **여기서만 확인 가능하다:** 소스에 lazy()가 그대로 있어도
      # 다른 파일의 정적 import 하나, 또는 codeSplitting 설정 변경만으로 그 화면이 부팅
      # 번들에 도로 실린다 — 소스 스캔은 둘 다 그린이다. 증상은 "느려짐"뿐이라 눈에 안 띈다.
      # (실측: 정적 import로 되돌려도 vitest 871개가 전부 통과했다.)
      # content-verify job은 별도 러너라 dist를 볼 수 없어서 이 job에 둔다.
      - name: Verify dist chunks
        working-directory: ./game
        run: npm run verify:dist-chunks

      # 게이트 2e — 한글 줄바꿈. **여기서만 확인 가능하다:** 소스 CSS에 선언이 있어도 번들에서
      # 빠지거나(플러그인 순서·미사용 판정) 뒤 규칙이 덮으면 실서버에서만 깨진다. 증상이
      # "글이 좀 이상하게 끊김"이라 눈에 안 띄고, 실제로 이 선언이 없던 동안 엔딩 회고가
      # 320px에서 줄바꿈 11곳 중 9곳이 어절 한가운데였다.
      # content-verify job은 별도 러너라 dist를 볼 수 없어서 이 job에 둔다.
      - name: Verify dist typography
        working-directory: ./game
        run: npm run verify:dist-typography

      # 게이트 2f — 앨범 격자용 CG 축소본(.thumb.webp). **여기서만 확인 가능하다:**
      # 축소본은 GEN_WEBP=1 빌드에서만 생기므로 소스에는 존재하지 않는다. 앨범 격자의 <img>에는
      # onError 폴백이 없어서, 축소본이 빠지면 빌드는 성공한 채로 그 칸이 깨진 이미지가 된다.
      - name: Verify dist CG thumbnails
        working-directory: ./game
        run: npm run verify:dist-cg-thumbs

      # 배포 아티팩트는 main push에서만 업로드 (PR 검증 시엔 스킵)
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: ./game/dist

  # 게이트 3 — 콘텐츠 회귀 검증 (부모 아크·reach·기억·생일 CG 필수세트·배경 학교급 정합 등).
  # 종수는 여기 적지 않는다 — verify:ci-gates가 디스크의 verify-*.ts 집합과 체인을 대조해 잠근다.
  # **이 파일 자체도 34종 중 하나(verify:ci-gates)가 검사한다.** 리포의 잠금은 전부 package.json
  # 스크립트인데 그걸 부르는 건 이 YAML 한 파일이라, 여기서 스텝을 지우면 아무도 모르는 상태였다.
  # 요구 목록은 package.json의 verify:dist-* 집합에서 파생되므로, 새 게이트를 만들고 여기에
  # 안 붙이는 반대 방향도 같이 잡힌다. 위 build job의 `npm test`에서도 같은 판정이 도는데
  # (src/engine/__tests__/ciGateWiring.test.ts), 이유는 아래 verify:ci 스텝 자체가 지워지는
  # 경우다 — 한 자리에만 두면 그 자리를 지우는 편집이 통과한다.
  # build와 독립 병렬로 돌되, deploy가 둘 다에 의존한다 (2026-07-13 게이트 승격).
  # 이전엔 PR 체크 전용이었으나 main 직접 push 시 검증 없이 배포되는 구멍이 있어 배포 게이트로 전환.
  content-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: ./game
        run: npm ci

      - name: Content Verify
        working-directory: ./game
        run: npm run verify:ci

  deploy:
    # 배포는 main push에서만 — PR은 위 build 게이트까지만 돈다
    if: github.event_name == 'push'
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, content-verify]
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
